    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
      (function () {
        var url = new URL(window.location.href);
        var asked = url.searchParams.get("lang");
        url.searchParams.delete("lang");
        var stored = null;
        try {
          stored = window.localStorage.getItem("ryotech-lang");
        } catch (e) {}
        var lang = asked === "ar" || asked === "en" ? asked : stored === "ar" ? "ar" : "en";
        window.location.replace("/" + lang + "/" + url.search + url.hash);
      })();
    </script>
